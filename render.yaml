# SIA-QR — Blueprint gratis (Render free + Vercel free para frontend).
# Backend + Postgres en Render. Frontend va en Vercel (rootDirectory=frontend).
databases:
  - name: sia-qr-db
    plan: free
    databaseName: sia_qr
    user: sia_qr

services:
  - type: web
    name: sia-qr-backend
    runtime: python
    plan: free
    region: ohio
    branch: master
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn sia_qr.wsgi --bind 0.0.0.0:$PORT"
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sia-qr-db
          property: connectionString
